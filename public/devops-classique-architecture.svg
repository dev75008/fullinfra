<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">DevOps classique : un cycle continu</title><desc id="desc">Planifier, coder, construire, tester, livrer, déployer, exploiter, observer et recommencer. Cinq piliers : CI/CD, infrastructure comme code, conteneurisation, monitoring et collaboration.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0067b8"/></marker></defs><rect width="1440" height="900" fill="#f2f7fc"/><g font-family="Segoe UI,Arial,sans-serif" fill="#203748"><text x="64" y="86" font-size="48" font-weight="600">DevOps classique</text><text x="64" y="134" font-size="25" fill="#526676">Du besoin à la production, puis du terrain au prochain changement</text><g transform="translate(64 206)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">1</text><text x="24" y="91" font-size="29" font-weight="600">Planifier</text><text x="24" y="123" font-size="17" fill="#526676">Besoins et responsabilités</text></g><g transform="translate(398 206)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">2</text><text x="24" y="91" font-size="29" font-weight="600">Coder</text><text x="24" y="123" font-size="17" fill="#526676">Git et revue de code</text></g><g transform="translate(732 206)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">3</text><text x="24" y="91" font-size="29" font-weight="600">Construire</text><text x="24" y="123" font-size="17" fill="#526676">Paquet ou image versionnée</text></g><g transform="translate(1066 206)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">4</text><text x="24" y="91" font-size="29" font-weight="600">Tester</text><text x="24" y="123" font-size="17" fill="#526676">Tests et contrôles bloquants</text></g><g transform="translate(64 410)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">5</text><text x="24" y="91" font-size="29" font-weight="600">Livrer</text><text x="24" y="123" font-size="17" fill="#526676">Artefact prêt à promouvoir</text></g><g transform="translate(398 410)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">6</text><text x="24" y="91" font-size="29" font-weight="600">Déployer</text><text x="24" y="123" font-size="17" fill="#526676">Préproduction puis production</text></g><g transform="translate(732 410)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">7</text><text x="24" y="91" font-size="29" font-weight="600">Exploiter</text><text x="24" y="123" font-size="17" fill="#526676">Service, données et capacité</text></g><g transform="translate(1066 410)"><rect width="310" height="150" rx="8" fill="white" stroke="#bad2e4"/><path d="M0 8Q0 0 8 0H302Q310 0 310 8V13H0Z" fill="#0067b8"/><text x="24" y="53" font-size="19" fill="#0067b8">8</text><text x="24" y="91" font-size="29" font-weight="600">Observer</text><text x="24" y="123" font-size="17" fill="#526676">Métriques, journaux et incidents</text></g><g fill="none" stroke="#0067b8" stroke-width="3" marker-end="url(#arrow)"><path d="M378 281h12"/><path d="M712 281h12"/><path d="M1046 281h12"/><path d="M378 485h12"/><path d="M712 485h12"/><path d="M1046 485h12"/><path d="M1355 356v30H219v18"/><path d="M1355 562v58H42V177H219v20"/></g><text x="450" y="613" font-size="23" fill="#0067b8">Retour d’expérience : observer pour améliorer</text><text x="64" y="679" font-size="27" font-weight="600">Les cinq piliers soutiennent l’ensemble du cycle</text><g transform="translate(64 710)"><rect width="243" height="112" rx="6" fill="white" stroke="#bad2e4"/><text x="18" y="38" font-size="19" font-weight="600">CI/CD</text><text x="18" y="75" font-size="16" fill="#526676">Tester et livrer</text></g><g transform="translate(331 710)"><rect width="243" height="112" rx="6" fill="white" stroke="#bad2e4"/><text x="18" y="38" font-size="19" font-weight="600">Infrastructure as Code</text><text x="18" y="75" font-size="16" fill="#526676">Décrire et configurer</text></g><g transform="translate(598 710)"><rect width="243" height="112" rx="6" fill="white" stroke="#bad2e4"/><text x="18" y="38" font-size="19" font-weight="600">Conteneurisation</text><text x="18" y="75" font-size="16" fill="#526676">Construire et exécuter</text></g><g transform="translate(865 710)"><rect width="243" height="112" rx="6" fill="white" stroke="#bad2e4"/><text x="18" y="38" font-size="19" font-weight="600">Monitoring</text><text x="18" y="75" font-size="16" fill="#526676">Observer et réagir</text></g><g transform="translate(1132 710)"><rect width="243" height="112" rx="6" fill="white" stroke="#bad2e4"/><text x="18" y="38" font-size="19" font-weight="600">Collaboration</text><text x="18" y="75" font-size="16" fill="#526676">Partager et améliorer</text></g><text x="64" y="864" font-size="18" fill="#526676">GitHub / GitLab · Jenkins · Docker · Kubernetes · Terraform · Ansible · Prometheus · Grafana</text><text x="1258" y="864" font-size="18" fill="#0067b8">fullinfra.</text></g></svg>