name: Publish FullInfra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:ui
      - run: npm run check:sources
      - run: npm run check:icons
      - run: node scripts/generate-m365-infographic.mjs --check
      - run: node scripts/generate-devops-classic.mjs --check
      - run: npm run build
      - run: npm run check:ai
      - run: node scripts/check-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
